name: Check SherKhan ZIP

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          echo "ZIP files found:"
          find . -maxdepth 2 -type f -name "*.zip" -print

          echo "ZIP contents:"
          unzip -l SherKhanWorld_4.8_APK_BUILD_READY_FINAL.zip | head -100

          echo "Searching for Android project:"
          unzip -l SherKhanWorld_4.8_APK_BUILD_READY_FINAL.zip | grep -E 'gradlew|settings.gradle|build.gradle|app/' | head -100
